# Talks shown on /talks/. `talks` is the numbered index; each talk has its own page under _pages/talks/ whose
# cards come from the series key named in `series` (one browser-playable deck per entry, under
# assets/talks/<series>/<folder>/: index.html + index_assets/ exported by manim-slides, plus poster.png and handout.pdf).
talks:
  - title: Entanglement asymmetry in the gapped XYZ spin-1/2 chain
    permalink: /talks/xyz-asymmetry/
    blurb: Four animated parts for undergraduates, from the entanglement entropy of a window to the paper's master formula. Built with Manim.
    series: xyz_asymmetry

xyz_asymmetry:
  - number: 1
    folder: part1_entropy
    title: Entanglement entropy
    summary: The part that knows less than the whole. Two coins and two spins give the same tallies; the density matrix, its red corners and the partial trace show where the difference hides, and the entropy meter reads it from the eigenvalue bars.
    scenes: 11
    stops: 15
    minutes: 14
  - number: 2
    folder: part2_asymmetry
    title: Entanglement asymmetry
    summary: A meter for a broken symmetry. Sorting the grid by charge, erasing the red blocks between charge drawers, and the Clock average that turns the asymmetry into half the log of the variance of a charge bell.
    scenes: 12
    stops: 24
    minutes: 17
  - number: 3
    folder: part3_xyz
    title: The XYZ chain
    summary: One knob, a map, stripes, a gap, and misprints that move. The coupling gamma manufactures red corners, the gap buys a short memory, kinks come in pairs, and one measurable quantity, the susceptibility, comes out of the infinite-chain method.
    scenes: 15
    stops: 23
    minutes: 17
  - number: 4
    folder: part4_synthesis
    title: Putting the blocks together
    summary: The master formula and the paper's figures. The half-log law, two routes to one quantity, the mass machine, the structure of the paper's figures, how an error bar is made, and the closed-form prediction in lattice variables.
    scenes: 15
    stops: 22
    minutes: 18
